<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – Hunty</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0c10;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #a1a1aa; max-width: 360px; line-height: 1.6; margin-bottom: 2rem; }
    button {
      background: #10b981;
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #059669; }
  </style>
</head>
<body>
  <div class="icon">🏴‍☠️</div>
  <h1>You're offline</h1>
  <p>No internet connection detected. Check your connection and try again — your hunt progress is saved locally.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
