name: Security Tests and Scans

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  security_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build Next.js app
        run: pnpm build

      - name: Start Next.js app in background
        run: |
          pnpm start &
          npx wait-on http://localhost:3000 --timeout 30000

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=moderate || true

      - name: Run Playwright security tests
        run: pnpm security:test || true

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.8.0
        with:
          target: "http://localhost:3000"
        continue-on-error: true # prevents workflow failure if ZAP fails
        # NOTE: The ZAP baseline expects a running server; we started it above.
