name: Bundle Size

on:
  pull_request:
    branches: [main, develop]

permissions:
  pull-requests: read

# Allow one concurrent deployment per branch, cancel in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bundle Size & Performance Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--no-frozen-lockfile"

      - name: Build Next.js application
        run: pnpm --filter @hunty/web run build

      - name: Check bundle size
        # Skip when the PR has the "skip-bundle-check" label (e.g. for intentional budget overruns)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-bundle-check') }}
        run: pnpm --filter @hunty/web run bundle:check

      - name: Check performance budgets
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-bundle-check') }}
        run: pnpm --filter @hunty/web run perf:budget
