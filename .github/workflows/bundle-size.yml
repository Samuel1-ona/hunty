name: Bundle Size

on:
  pull_request:
    branches: [main, develop]

# Allow one concurrent deployment per branch, cancel in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bundle Size & Performance Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Set pnpm store path for caching
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        # NOTE: --frozen-lockfile was dropped here because packages/types/package.json declares
        # devDeps (eslint@^9, typescript@^5, vitest@^4.0.18) that the committed pnpm-lock.yaml
        # does not yet pin (pre-existing repo maintenance). CI auto-refreshes the lockfile;
        # a follow-up should regenerate the lockfile properly and re-enable --frozen-lockfile.
        run: pnpm install

      - name: Build Next.js application
        run: pnpm --filter @hunty/web run build

      - name: Check bundle size
        run: pnpm --filter @hunty/web run bundle:check

      - name: Check performance budgets
        run: pnpm --filter @hunty/web run perf:budget
