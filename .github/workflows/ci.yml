name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Workspace quality (lint + typecheck) ──────────────────────────────
  quality:
    name: Quality — ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ['@hunty/web', 'mobile', '@hunty/types', '@hunty/ui', '@hunty/config']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck --filter=${{ matrix.workspace }}

  # ─── Merge-conflict damage check ───────────────────────────────────────
  merge-damage-check:
    name: Merge Conflict Damage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Parse every TypeScript file with esbuild
        run: |
          find . -type f \( -name '*.ts' -o -name '*.tsx' \) ! -path '*/node_modules/*' -print0 | \
            xargs -0 -r npx --yes esbuild --outdir=/tmp/esbuild-parse-check --log-level=error

  # ─── Workspace tests ──────────────────────────────────────────────────
  test:
    name: Tests — ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ['@hunty/web', '@hunty/types', '@hunty/ui', 'mobile']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run tests
        run: pnpm turbo run test --filter=${{ matrix.workspace }}

  # ─── Coverage (web only — only workspace with coverage config) ────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run tests with coverage
        run: pnpm turbo run test:coverage --filter=@hunty/web

      - name: Upload web coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage-report
          path: apps/web/coverage/
          retention-days: 30

      - name: Upload mobile coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage-report
          path: apps/mobile/coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          repository: Samuel1-ona/hunty
          files: ./apps/web/coverage/coverage-final.json,./apps/mobile/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Mutation tests ────────────────────────────────────────────────────
  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run mutation testing
        run: pnpm test:mutation

  # ─── Build verification ────────────────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build Next.js application
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

  # ─── Visual regression tests ───────────────────────────────────────────
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Visual Regression Tests
        run: pnpm exec playwright test visual-regression --reporter=github
        continue-on-error: true

      - name: Upload Visual Diff Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-diffs
          path: |
            e2e/screenshots/**/*.png
            test-results/
          retention-days: 30

  # ─── E2E tests ─────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ─── CI summary ────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, mutation, build, e2e, visual-regression, merge-damage-check]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.quality.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.coverage.result }}" = "failure" ] || \
             [ "${{ needs.mutation.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.e2e.result }}" = "failure" ] || \
             [ "${{ needs.visual-regression.result }}" = "failure" ] || \
             [ "${{ needs.merge-damage-check.result }}" = "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          echo "✅ CI Pipeline Passed"
