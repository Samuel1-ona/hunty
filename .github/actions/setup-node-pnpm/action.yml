name: "Setup Node.js with pnpm"
description: "Sets up Node.js, configures pnpm, caches dependencies, and installs with frozen lockfile"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "20"
  pnpm-version:
    description: "pnpm version to use"
    required: false
    default: "10.33.0"
  working-directory:
    description: "Working directory for pnpm install"
    required: false
    default: "."
  install-args:
    description: "Additional arguments for pnpm install"
    required: false
    default: "--frozen-lockfile"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Enable corepack for pnpm
      shell: bash
      run: |
        corepack enable pnpm
        corepack prepare pnpm@${{ inputs.pnpm-version }} --activate

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install ${{ inputs.install-args }}