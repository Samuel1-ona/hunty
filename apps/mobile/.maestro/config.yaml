# Maestro E2E configuration for Hunty Mobile
#
# Prerequisites:
#   brew tap mobile-dev-inc/tap && brew install maestro
#   cd apps/mobile && pnpm start
#   In another terminal: pnpm test:e2e
#
# CI runs flows/scan-qr-clue.yaml against release builds on an Android emulator
# and an iOS simulator via .github/workflows/mobile-e2e.yml

flows:
  - flows/feed-and-wallet.yaml
  - flows/scan-qr-clue.yaml
