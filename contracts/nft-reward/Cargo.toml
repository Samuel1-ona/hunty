[package]
name = "nft-reward"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]
# Require every metadata URI to use the `ipfs://` scheme (issue #1403).
#
# Off by default: Hunty also serves `https://` metadata today, so enabling this
# would reject URIs that are currently valid. Turn it on once all minters
# publish to IPFS. The non-empty and length rules apply either way.
require-ipfs-uri = []

[dependencies]
soroban-sdk = "=20.0.0"

[dev-dependencies]
soroban-sdk = { version = "=20.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
